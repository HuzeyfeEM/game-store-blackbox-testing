<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mini Oyun Mağazası</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0f1220;
            color: #e8e8f0;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            background: #171b2e;
            border-bottom: 1px solid #2a2f4a;
        }
        nav .logo { font-size: 20px; font-weight: bold; color: #ffffff; text-decoration: none; }
        nav .linkler a { color: #b8bdd8; text-decoration: none; margin-left: 20px; }
        nav .linkler a:hover { color: #ffffff; }
        .kapsayici { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .kart {
            background: #171b2e;
            border: 1px solid #2a2f4a;
            border-radius: 12px;
            padding: 28px;
            max-width: 420px;
            margin: 0 auto;
        }
        h2 { margin-top: 0; }
        label { display: block; font-size: 14px; color: #b8bdd8; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: #0f1220;
            border: 1px solid #2a2f4a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #7c5cff; }
        button, .buton {
            display: inline-block;
            width: 100%;
            padding: 11px;
            background: #7c5cff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        button:hover, .buton:hover { background: #6a48f0; }
        .mesaj {
            max-width: 420px;
            margin: 0 auto 12px auto;
            padding: 10px 14px;
            background: #2a2040;
            border-left: 4px solid #7c5cff;
            border-radius: 6px;
        }
        a { color: #9d85ff; }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="/">🎮 Mini Oyun Mağazası</a>
        <div class="linkler">
            <a href="/oyunlar">Oyunlar</a>
            {% if session.get("kullanici") %}
                <a href="/sepet">Sepet</a>
                <a href="/cikis">Çıkış Yap ({{ session.get("kullanici") }})</a>
            {% else %}
                <a href="/giris">Giriş Yap</a>
                <a href="/kayit">Kayıt Ol</a>
            {% endif %}
        </div>
    </nav>

    <div class="kapsayici">
        {% with mesajlar = get_flashed_messages() %}
            {% for mesaj in mesajlar %}
                <div class="mesaj">{{ mesaj }}</div>
            {% endfor %}
        {% endwith %}

        {% block icerik %}{% endblock %}
    </div>
</body>
</html>
