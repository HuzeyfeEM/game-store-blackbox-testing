{% extends "base.html" %}

{% block icerik %}
    <div class="kart" style="max-width: 600px;">
        <h2>🛒 Sepetim</h2>

        {% if urunler %}
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                <tr style="text-align: left; color: #b8bdd8;">
                    <th style="padding: 8px 0;">Oyun</th>
                    <th>Adet</th>
                    <th>Tutar</th>
                </tr>
                {% for urun in urunler %}
                    <tr style="border-top: 1px solid #2a2f4a;">
                        <td style="padding: 10px 0;">{{ urun.ad }}</td>
                        <td>{{ urun.adet }}</td>
                        <td>{{ urun.ara_toplam }} TL</td>
                    </tr>
                {% endfor %}
            </table>
            <p style="font-size: 20px;">Toplam: <b style="color: #9d85ff;">{{ toplam }} TL</b></p>
        {% else %}
            <p>Sepetiniz boş.</p>
        {% endif %}

        <form method="POST" action="/satin-al">
            <button type="submit">Satın Al</button>
        </form>
        <p><a href="/oyunlar">← Alışverişe devam et</a></p>
    </div>
{% endblock %}
